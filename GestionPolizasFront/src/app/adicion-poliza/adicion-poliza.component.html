<form (ngSubmit)="onSubmit()" #PolicyModel="ngForm">
    <div class="form-row">
      <div class="form-group col-md-6">
        <label for="inputPolicyName">Nombre</label>
        <input type="text" class="form-control" id="policyName" placeholder="Nombre" name="name" required>
      </div>
      <div class="form-group col-md-6">
        <label for="inputPolicyDescription">Descripcion</label>
        <input type="text" class="form-control" id="policyDescription" placeholder="Descripcion" name="description">
      </div>
    </div>
    <div class="form-row">
        <div class="form-group col-md-4">
            <label for="inputPolicyType">Tipo Poliza</label>
            <select id="inputTypes" class="form-control" name="policyTypeId">
              <option id="1">TERREMOTO</option>
              <option id="2">INCENDIO</option>
              <option id="3">ROBO</option>
              <option id="4">PERDIDA</option>
            </select>
          </div>
      <div class="form-group col-md-4">
        <label for="inputCovarage">Covertura</label>
        <input type="number" class="form-control" id="inputCoverage" placeholder="Covertura" name="coverage">
      </div>
      <div class="form-group col-md-4">
          <label for="inputPrice">Precio</label>
          <input type="number" class="form-control" id="inputPrice" placeholder="Precio" name="price">
        </div>
      <div class="form-group col-md-4">
        <label for="inputRisk">Riesgo</label>
        <select id="inputRisk" class="form-control" name="riskTypeId">
          <option id="1">BAJO</option>
          <option id="1">MEDIO</option>
          <option id="1">MEDIO-ALTO</option>
          <option id="1">ALTO</option>
        </select>
      </div>
    </div>
    <div>
        <div class="form-group col-md-2">
            <input class="form-check-input" type="checkbox" id="gridCheck" name="active">
            <label class="form-check-label" for="gridCheck">
              Activa
            </label>
        </div>
    </div>
    <button type="submit" class="btn btn-primary">Guardar</button>
  </form>
